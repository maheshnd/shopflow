name: Deploy

on:
    workflow_dispatch:
        inputs:
            component:
                description: "Component to deploy"
                required: true
                type: choice
                options:
                    - api
                    - web
                    - both

jobs:
    deploy-api:
        if: >
            inputs.component == 'api' ||
            inputs.component == 'both'

        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Build API Docker image
              run: |
                  docker build \
                    -f apps/api/Dockerfile \
                    -t shopflow-api:${{ github.sha }} \
                    .

    deploy-web:
        if: >
            inputs.component == 'web' ||
            inputs.component == 'both'

        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Web deployment placeholder
              run: |
                  echo "Web deployment will be added after runtime API configuration is finalized."
