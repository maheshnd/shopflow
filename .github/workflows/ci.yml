name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://shopflow:shopflow@localhost:5432/shopflow_test
      NODE_ENV: test

    services:
      postgres:
        image: postgres:18-alpine

        env:
          POSTGRES_USER: shopflow
          POSTGRES_PASSWORD: shopflow
          POSTGRES_DB: shopflow_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U shopflow -d shopflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and component tests
        run: pnpm test

      - name: Run database migrations
        run: pnpm --filter @shopflow/api db:migrate

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build
