name: Deploy

on:
  workflow_dispatch:
    inputs:
      component:
        description: "Component to deploy"
        required: true
        type: choice
        options:
          - api
          - web
          - both

permissions:
  contents: read
  id-token: write

jobs:
  deploy-api:
    if: >
      inputs.component == 'api' ||
      inputs.component == 'both'

    runs-on: ubuntu-latest

    permissions:
        contents: read
        id-token: write

    env:
        AWS_REGION: us-east-1
        ECR_REPOSITORY: shopflow-api
        EKS_CLUSTER_NAME: shopflow-eks-eksCluster-f5d0ea6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API and migration images
        env:
            ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            IMAGE_TAG: ${{ github.sha }}
        run: |
            API_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
            MIGRATION_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG-migrate"

            echo "Building API image: $API_IMAGE"

            docker build \
                --platform linux/amd64 \
                --target runtime \
                -f apps/api/Dockerfile \
                -t "$API_IMAGE" \
                .

            docker push "$API_IMAGE"

            echo "Building migration image: $MIGRATION_IMAGE"

            docker build \
                --platform linux/amd64 \
                --target migration \
                -f apps/api/Dockerfile \
                 -t "$MIGRATION_IMAGE" \
                .
            
            docker push "$MIGRATION_IMAGE"

            echo "Published API image: $API_IMAGE"
            echo "Published migration image: $MIGRATION_IMAGE"

            echo "API_IMAGE=$API_IMAGE" >> "$GITHUB_ENV"
            echo "MIGRATION_IMAGE=$MIGRATION_IMAGE" >> "$GITHUB_ENV"
        
      - name: Configure kubectl for EKS
        run: |
            aws eks update-kubeconfig \
                --region "$AWS_REGION" \
                --name "$EKS_CLUSTER_NAME"

      - name: Run database migration
        run: |
           kubectl delete job shopflow-db-migrate \
            -n shopflow \
            --ignore-not-found

           sed "s|MIGRATION_IMAGE|$MIGRATION_IMAGE|g" \
            k8s/api/migration-job.yaml \
           | kubectl apply -f -

            kubectl wait \
              --for=condition=complete \
              job/shopflow-db-migrate \
              -n shopflow \
              --timeout=300s
      
      - name: Deploy API to EKS
        run: |
           sed "s|API_IMAGE|$API_IMAGE|g" \
            k8s/api/deployment.yaml \
           | kubectl apply -f -

            kubectl rollout status \
              deployment/shopflow-api \
              -n shopflow \
              --timeout=120s

      - name: Deploy API service
        run: |
           kubectl apply \
            -f k8s/api/service.yaml

      - name: Deploy API ingress
        run: kubectl apply -f k8s/api/ingress.yaml

  deploy-web:
    if: >
      inputs.component == 'web' ||
      inputs.component == 'both'

    runs-on: ubuntu-latest

    steps:
      - name: Web deployment placeholder
        run: echo "Web deployment will be added later."